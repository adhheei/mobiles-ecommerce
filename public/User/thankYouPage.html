<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/js/authGuard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You - Jinsa Mobiles</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #fcfcfc;
        color: #1a1a1a;
      }

      .thank-you-container {
        max-width: 800px;
        margin: 60px auto;
        text-align: center;
        padding: 0 15px;
      }

      .reveal-up-element {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 1.2s cubic-bezier(0.2, 1, 0.3, 1),
          transform 1.2s cubic-bezier(0.2, 1, 0.3, 1);
        will-change: transform, opacity;
      }

      .reveal-up-element.active {
        opacity: 1;
        transform: translateY(0);
      }

      /* Homepage Title Font Style */
      h1.homepage-font {
        font-family: "Poppins", sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .success-icon {
        width: 80px;
        height: 80px;
        background-color: #28a745;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        margin: 0 auto 25px;
      }

      .order-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        text-align: left;
      }

      .order-card-header {
        padding: 20px 30px;
        border-bottom: 1px solid #eee;
      }

      .order-item-row {
        padding: 20px 30px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #eee;
      }

      .item-thumb {
        width: 60px;
        height: 70px;
        border-radius: 8px;
        object-fit: cover;
        margin-right: 20px;
      }

      .item-total {
        margin-left: auto;
        font-weight: 600;
      }

      .order-totals-row {
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
      }

      .order-totals-row.final {
        font-size: 1.1rem;
        font-weight: 700;
        border-top: 1px solid #eee;
      }

      .size-lg {
        font-size: 1.2rem;
        font-weight: 800;
      }

      .shipping-info-row {
        padding: 20px 30px;
        background: #f9f9f9;
        display: flex;
        justify-content: space-between;
        gap: 30px;
      }

      .action-buttons {
        margin-top: 40px;
        display: flex;
        justify-content: center;
        gap: 20px;
      }

      .btn-black {
        background: #1a1a1a;
        color: white;
        padding: 12px 30px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
      }

      .btn-outline {
        background: #e9ecef;
        padding: 12px 30px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        color: #1a1a1a;
      }
    </style>
  </head>

  <body>
    <div class="thank-you-container reveal-up-element" id="main-content">
      <div class="success-icon">
        <i class="fa-solid fa-check"></i>
      </div>

      <h1 class="homepage-font display-5 mb-3">Thank You for Your Order!</h1>
      <p class="order-number-text text-muted mb-4"></p>

      <div class="mb-4">
        <span
          class="badge bg-success fs-6 px-3 py-2 rounded-pill"
          id="order-status-badge"
          >Order Placed Successfully</span
        >
      </div>

      <div class="order-card">
        <div class="order-card-header">
          <h5>Order Summary</h5>
          <p class="text-muted">A confirmation email has been sent.</p>
        </div>

        <!-- Items inserted dynamically -->

        <!-- Totals inserted dynamically -->

        <div class="shipping-info-row">
          <div class="info-column">
            <h6>Shipping Address</h6>
            <p></p>
          </div>
          <div class="info-column text-end">
            <h6>Estimated Delivery</h6>
            <p></p>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <a href="./userOrderDetails.html" class="btn-black"
          >View Order History</a
        >
        <a href="/User/index.html" class="btn-outline">Continue Shopping</a>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ✅ FINAL FIXED SCRIPT -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const summaryJSON = sessionStorage.getItem("lastOrderData");
        const container = document.getElementById("main-content");

        // Reveal animation
        setTimeout(() => {
          if (container) container.classList.add("active");
        }, 100);

        if (!summaryJSON) {
          document.querySelector("h1").innerText = "Order Successful!";
          const card = document.querySelector(".order-card");
          if (card) card.style.display = "none";
          return;
        }

        const order = JSON.parse(summaryJSON);

        // --- 1. IMAGE HELPER ---
        function formatImageUrl(path) {
          if (!path) return "https://placehold.co/100x100?text=No+Image";
          if (path.startsWith("http")) return path;
          let cleanPath = path.replace(/^public\//, "").replace(/\\/g, "/");
          return cleanPath.startsWith("/") ? cleanPath : "/" + cleanPath;
        }

        // Fix: Order ID display
        const orderNumEl = document.querySelector(".order-number-text");
        if (orderNumEl) {
          orderNumEl.innerHTML = `Your order <strong>#${order.orderId || "N/A"}</strong> has been placed.<br>
         <small class="text-muted">${new Date().toLocaleDateString("en-IN", { weekday: "long", year: "numeric", month: "long", day: "numeric" })}</small>`;
        }

        // Fix: Payment Status
        const statusBadge = document.getElementById("order-status-badge");
        if (statusBadge && order.paymentMethod) {
          statusBadge.innerText = `Order Placed • ${order.paymentMethod.toUpperCase()}`;
        }

        /* --- 2. RENDER ITEMS (FIXES UNDEFINED & NaN) --- */
        const header = document.querySelector(".order-card-header");
        document.querySelectorAll(".order-item-row").forEach((e) => e.remove());

        if (order.items && header) {
          order.items.forEach((item) => {
            const row = document.createElement("div");
            row.className = "order-item-row";

            // Map keys carefully to avoid undefined
            const name = item.name || item.productName || "Product Name";
            const qty = item.quantity || item.qty || 1;
            const price = parseFloat(item.price) || 0; // Fixes NaN
            const totalLine = price * qty;

            row.innerHTML = `
                <img src="${formatImageUrl(item.image)}" 
                     class="item-thumb" 
                     style="width: 50px; height: 60px; object-fit: contain;"
                     onerror="this.src='https://placehold.co/50x60?text=Error'">
                <div style="flex-grow: 1;">
                    <div class="fw-bold mb-1">${name}</div>
                    <div class="text-muted small">Qty: ${qty}</div>
                    <div class="mt-1"><span class="fw-bold">Rs. ${price.toLocaleString()}</span></div>
                </div>
                <div class="item-total fw-bold">Rs. ${totalLine.toLocaleString()}</div>
            `;
            header.after(row);
          });
        }

        /* --- 3. TOTALS --- */
        const shippingRow = document.querySelector(".shipping-info-row");
        document
          .querySelectorAll(".order-totals-row")
          .forEach((e) => e.remove());

        const addTotal = (label, value, colorClass = "", bold = false) => {
          const row = document.createElement("div");
          row.className = `order-totals-row ${bold ? "final" : ""}`;
          row.innerHTML = `
            <span class="${bold ? "" : "text-muted"}">${label}</span>
            <span class="${colorClass} ${bold ? "fw-bold" : ""}">
                ${typeof value === "number" ? `Rs. ${value.toLocaleString("en-IN")}` : value}
            </span>`;
          if (shippingRow)
            shippingRow.parentNode.insertBefore(row, shippingRow);
        };

        if (order.totals) {
          const t = order.totals;
          if (t.totalMrp) addTotal("Actual Price", t.totalMrp);
          if (t.subtotal) addTotal("Subtotal", t.subtotal);
          if (t.couponDiscount > 0)
            addTotal(
              "Coupon Discount",
              `- Rs. ${t.couponDiscount}`,
              "text-success",
            );
          if (t.walletDeducted > 0)
            addTotal(
              "Wallet Paid",
              `- Rs. ${t.walletDeducted}`,
              "text-success",
            );
          addTotal(
            "Shipping",
            t.shipping === 0 ? "Free" : `Rs. ${t.shipping}`,
            t.shipping === 0 ? "text-success fw-bold" : "",
          );
          addTotal("Total Payable Amount", t.totalAmount, "size-lg", true);
        }

        /* --- 4. ADDRESS & DELIVERY --- */
        const a = order.address;
        const addrEl = document.querySelector(
          ".shipping-info-row .info-column p",
        );
        if (a && addrEl) {
          addrEl.innerHTML = `
            <div class="fw-bold text-dark">${a.fullName}</div>
            <div class="text-muted small">${a.street}, ${a.city}<br>${a.state} - ${a.pincode}</div>
        `;
        }

        const delEl = document.querySelector(
          ".shipping-info-row .info-column.text-end p",
        );
        if (delEl) {
          const d = new Date();
          d.setDate(d.getDate() + 7);
          delEl.innerHTML = `<span class="fw-bold text-success">${d.toLocaleDateString("en-IN", { day: "numeric", month: "short" })}</span>`;
        }
      });
    </script>
  </body>
</html>
